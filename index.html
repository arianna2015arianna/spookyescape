<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spooky Escape — Enhanced</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Spooky Escape</h1>
    <div class="controls">
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="resetBtn">Reset</button>
      <button id="muteBtn">Mute</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <section class="panel">
        <h2>Inventory</h2>
        <ul id="inventory"></ul>
      </section>

      <section class="panel">
        <h2>Quick Actions</h2>
        <button id="lookBtn">Look</button>
        <button id="takeBtn">Take</button>
        <button id="useBtn">Use</button>
      </section>
    </aside>

    <section id="game">
      <div id="room-title" class="title"></div>
      <div id="room-desc" class="desc" tabindex="0"></div>

      <div id="exits" class="exits"></div>

      <div id="items" class="items"></div>

      <div class="touch-controls">
        <button data-dir="north">↑</button>
        <div>
          <button data-dir="west">←</button>
          <button data-dir="east">→</button>
        </div>
        <button data-dir="south">↓</button>
      </div>
    </section>
  </main>

  <footer>
    <small>Tip: Use arrow keys or on-screen arrows. Click objects to interact.</small>
  </footer>

  <script src="game.js" defer></script>
</body>
</html>
